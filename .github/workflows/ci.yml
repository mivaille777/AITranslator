name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - WebReBuild
  push:
    branches:
      - main
      - WebReBuild

permissions:
  contents: read

# Keep only the newest CI for each event/source pair. Push and pull_request
# workflows must not share the same concurrency group because a branch push
# can otherwise cancel the PR check that is required before merging to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (3.11)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        shell: pwsh
        run: python -m pip install --upgrade pip

      - name: Prepare test results directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force test-results | Out-Null

      - name: Run test suite
        shell: pwsh
        run: .\scripts\test.ps1 -Install -PytestArgs '--junitxml=test-results/pytest.xml'

      - name: Run Research Memory reliability benchmark
        shell: pwsh
        run: python scripts/run_research_memory_regression.py --report test-results/research-memory-regression.json

      - name: Run Cross-document Research benchmark
        shell: pwsh
        run: python scripts/run_cross_document_research_regression.py --report test-results/cross-document-research-regression.json

      - name: Run Evidence Ledger benchmark
        shell: pwsh
        run: python scripts/run_evidence_ledger_regression.py --report test-results/evidence-ledger-regression.json

      - name: Run Agent regression benchmark
        shell: pwsh
        run: python scripts/run_agent_regression_benchmark.py --report test-results/agent-regression.json

      # Stage 15's real LLM judge is intentionally excluded from deterministic
      # merge CI. This replay validates schema parsing, deterministic verdict
      # policy, aggregation, privacy-safe reporting and human-review override.
      - name: Validate Agent qualitative evaluation protocol
        shell: pwsh
        run: >-
          python scripts/run_agent_quality_evaluation.py
          --judgements backend/evaluation/fixtures/stage15_quality_judgements.json
          --reviews backend/evaluation/fixtures/stage15_human_reviews.json
          --report test-results/agent-quality-protocol.json
          --require-resolved

      - name: Run legacy application smoke test
        shell: pwsh
        run: python -m app.main --smoke-test

      - name: Upload Python test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-python-${{ github.run_id }}
          path: |
            test-results/pytest.xml
            test-results/research-memory-regression.json
            test-results/cross-document-research-regression.json
            test-results/evidence-ledger-regression.json
            test-results/agent-regression.json
            test-results/agent-quality-protocol.json
          if-no-files-found: warn
          retention-days: 14

  web-frontend:
    name: React lint, tests, and build
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

  tauri-shell:
    name: Tauri shell build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # `cargo check` does not run the final MSVC link step. Building the shell
      # catches missing Windows SDK import libraries (for example advapi32.lib
      # or dwmapi.lib) and validates the same stage used by local Tauri dev.
      - name: Build and link Tauri shell
        shell: pwsh
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features
