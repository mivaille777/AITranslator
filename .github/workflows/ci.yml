name: CI

on:
  pull_request:
    branches:
      - main
      - WebReBuild
  push:
    branches:
      - main
      - WebReBuild

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (3.11)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        shell: pwsh
        run: python -m pip install --upgrade pip

      - name: Run test suite
        shell: pwsh
        run: .\scripts\test.ps1 -Install

      - name: Run legacy application smoke test
        shell: pwsh
        run: python -m app.main --smoke-test

  web-frontend:
    name: React build and lint
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  tauri-shell:
    name: Tauri shell check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri shell
        shell: pwsh
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features
