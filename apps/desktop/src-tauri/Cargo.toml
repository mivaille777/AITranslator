[package]
name = "aitrans-desktop"
version = "0.1.0"
description = "Thin Tauri shell for AITranslator WebReBuild"
authors = ["AITranslator contributors"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
