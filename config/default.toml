[app]
name = "Desktop Translator"
version = "0.1.0"

[logging]
level = "INFO"
directory = "logs"

[translation]
# WebReBuild currently defaults to Youdao's web-compatible translator.
# Set to "google_web" to restore the previous provider.
provider = "youdao_web"
source_language = "auto"
target_language = "zh-CN"
cache_enabled = true
cache_max_size = 128
max_text_length = 5000

[ai]
provider = "deepseek"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
chat_selection_capture_enabled = true

[google_web]
enabled = true
endpoint = "https://translate.googleapis.com/translate_a/single"
timeout_ms = 8000
# One bounded retry absorbs stale keep-alive sockets and short 429/5xx bursts.
max_retries = 1
# Keep automatic/manual live translation from creating back-to-back web hits.
min_interval_ms = 120

[youdao_web]
enabled = true
endpoint = "https://fanyi.youdao.com/translate"
timeout_ms = 8000
# Keep retries bounded; web-compatible endpoints may rate-limit automation.
max_retries = 1
min_interval_ms = 200

[cache]
enabled = true
max_size = 128
sqlite_enabled = true
sqlite_path = "config/translation_cache.sqlite3"
history_enabled = false

[trigger]
mode = "auto"
hotkey = "alt+q"
debounce_ms = 250

[input]
hotkey = "alt+q"
hotkey_debounce_ms = 250
auto_selection_enabled = true
auto_selection_debounce_ms = 250

[selection]
uia_timeout_ms = 250

[overlay]
position_mode = "desktop_lyrics_bottom"
font_family = "Segoe UI"
font_size = 24
# Legacy single-opacity key; new settings use the two fields below.
opacity = 1.0
background_opacity = 1.0
text_opacity = 1.0
max_width = 900
locked = false
theme = "dark"
show_original = false
margin = 24
custom_position_x = 80
custom_position_y = 80
mouse_offset_x = 16
mouse_offset_y = 16
